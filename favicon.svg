<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HF">
  <!-- Oracle-red plate; letters drawn as rectangles so they stay crisp at 16px
       and never depend on a font being available. -->
  <rect width="64" height="64" rx="8" fill="#d84048"/>
  <g fill="#ffffff">
    <!-- H -->
    <rect x="10" y="17" width="6" height="30"/>
    <rect x="24" y="17" width="6" height="30"/>
    <rect x="10" y="29" width="20" height="6"/>
    <!-- F -->
    <rect x="38" y="17" width="6" height="30"/>
    <rect x="38" y="17" width="16" height="6"/>
    <rect x="38" y="29" width="13" height="6"/>
  </g>
</svg>
